services:
  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD in .env}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 400m
    restart: unless-stopped

  metabase:
    image: ghcr.io/rahimcc/turyan-metabase:sha-dc4c08a
    container_name: metabase
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD in .env}
      MB_DB_HOST: metabase-db
      JAVA_OPTS: "-Xmx2g -Xms1g"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 2.5g
    restart: unless-stopped

volumes:
  metabase-db-data: